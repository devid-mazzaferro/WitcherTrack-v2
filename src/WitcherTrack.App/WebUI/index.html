<!DOCTYPE html>
<!--
  Dashboard.

  Three states: no mode chosen yet (the picker), a mode chosen (progress + chart), and
  no catalogue at all (an explanation rather than a wall of zeroes).

  Live data arrives over /api/events. The pushed payload deliberately carries only the
  last handful of completions; the chart pulls the full run from /api/timeline and
  refetches when the payload's unlockCount says there is something new, so a fifteen-
  hundred-entry history is not re-sent on every single pickup.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>WitcherTrack</title>
<style>
  /* Industrial/metallic surface: cool greys instead of the earlier warm-gold scheme.
     Series colours are the validated dark-mode categorical slots 1-5, in slot order,
     re-checked against THIS surface with the palette validator (worst adjacent CVD dE 8.4,
     normal-vision 19.3, all >= 3:1 contrast) - unchanged, they still pass. Identity never
     rests on colour alone: every series carries its icon and its name in the legend and at
     the end of its line. */
  :root {
    color-scheme: dark;
    --page:        #101214;
    --surface:     #171a1e;
    --hairline:    #24272c;
    --grid:        #2b2f35;
    --axis:        #383c43;
    --ink:         #e6e9ec;
    --ink-2:       #9aa3ad;
    --ink-muted:   #6c747c;
    --accent:        #b9c6d1;
    --accent-bright: #d3dde5;
    --danger:        #cf6252;
    --danger-border: #7a352c;
    --border:      #30353c;
    --hover-bg:    #1d2126;
    --track-bg:    #23272c;
    --switch-on:   #20242a;
    --tick:        #7d858d;

    --series-quest:   #3987e5;
    --series-diagram: #d95926;
    --series-formula: #199e70;
    --series-poi:     #c98500;
    --series-gwent:   #d55181;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2.5rem; background: var(--page); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* Single column everything else lines up against, centred rather than stretched edge
     to edge on a wide monitor - the dashboard being "full screen wide" was the very
     first complaint about this layout, and letting every block below pick its own
     max-width independently (previously 660-1300px, all different) was what made the
     page's right edge zigzag block to block. One width, set once. */
  .page { max-width: 1300px; margin: 0 auto; }

  /* ---------- header ---------- */
  /* The brand mark and the run's actions used to be two unrelated blocks stacked on
     separate rows - a title floating top-left, a button row floating top-right, with
     nothing tying them together. One row, one baseline, one hairline underneath to
     ground the whole header as a single band the rest of the page hangs from. */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            flex-wrap: wrap; padding-bottom: 1.25rem; margin-bottom: 2rem;
            border-bottom: 1px solid var(--hairline); }
  .brand { display: flex; align-items: center; gap: .9rem; }
  .brand .logo { height: 44px; width: auto; flex: none; }
  h1 { font-size: 1rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
       margin: 0; display: flex; align-items: baseline; gap: .6rem; }
  h1 .tag { font-size: .68rem; letter-spacing: .06em; color: var(--ink-muted); text-transform: none; }
  h2.section { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase;
               color: var(--ink-2); margin: 0 0 .25rem; font-weight: 600; }
  .section-note { font-size: .78rem; color: var(--ink-muted); margin: 0 0 1rem; }

  /* ---------- mode picker ---------- */
  .picker { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            max-width: 980px; }
  .picker button { all: unset; cursor: pointer; border: 1px solid var(--border); border-radius: 10px;
                   padding: 1.4rem 1.2rem; background: var(--surface);
                   transition: border-color .15s, background .15s; }
  .picker button:hover, .picker button:focus-visible { border-color: var(--accent); background: var(--hover-bg); }
  .picker .label { font-size: .95rem; font-weight: 600; }
  .picker .scope { font-size: .78rem; color: var(--ink-2); margin-top: .35rem; }

  /* ---------- toolbar ---------- */
  /* One tidy group, right-aligned as a whole, and now living in the header band itself
     (see .topbar) rather than as its own row above the content - "change mode" is no
     longer stranded on the left with everything else pushed to the far right, and the
     actions no longer float disconnected from the title that names what they act on. */
  .toolbar { display: flex; align-items: center; justify-content: flex-end; gap: .6rem;
             flex-wrap: wrap; min-height: 2rem; }
  .btn { all: unset; cursor: pointer; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
         color: var(--ink-2); border: 1px solid var(--border); border-radius: 6px; padding: .45rem .85rem; }
  .btn:hover, .btn:focus-visible { color: var(--ink); border-color: #454b53; }
  .btn.danger:hover { color: var(--danger); border-color: var(--danger-border); }

  /* Small inline action pinned to a KPI tile (e.g. "Manually fix gwent cards"), not the
     toolbar - it drops to its own line inside the tile rather than widening the tile. */
  .kind .fix { all: unset; cursor: pointer; flex-basis: 100%; font-size: .64rem;
               letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted);
               border: 1px solid var(--border); border-radius: 5px; padding: .3rem .5rem;
               text-align: center; line-height: 1.2; margin-top: .1rem; }
  .kind .fix:hover, .kind .fix:focus-visible { color: var(--danger); border-color: var(--danger-border); }

  /* ---------- headline ---------- */
  .hero { display: flex; align-items: baseline; gap: 1rem; }
  .hero .pct { font-size: 3rem; }
  .hero .frac { font-size: 1.05rem; color: var(--ink-muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--track-bg); margin: .5rem 0 2rem;
         overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

  /* ---------- per-kind tiles ---------- */
  /* Fixed 5 columns - there are always exactly 5 kinds - so they read as one tidy row
     instead of wrapping unevenly (4 + 1) at in-between widths. Falls back to wrapping
     only once the viewport is too narrow to fit all five comfortably. */
  .kinds { display: grid; gap: .9rem; grid-template-columns: repeat(5, 1fr);
           margin-bottom: 2.25rem; }
  @media (max-width: 980px) {
    .kinds { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  }
  .kind { display: flex; align-items: center; flex-wrap: wrap; gap: .8rem; border: 1px solid var(--hairline);
          border-radius: 8px; padding: .75rem .9rem; background: var(--surface);
          border-left: 3px solid var(--kind-colour, var(--hairline)); }
  .kind img { width: 34px; height: 34px; flex: none; }
  .kind .name { font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  .kind .figure { font-size: 1.05rem; font-variant-numeric: tabular-nums; }

  /* ---------- chart ---------- */
  .chart-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px;
                padding: 1.25rem 1.25rem 1rem; position: relative; }
  .chart-head { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap;
                margin-bottom: .9rem; }
  .switch { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
            flex: none; }
  .switch button { all: unset; cursor: pointer; padding: .35rem .8rem; font-size: .72rem;
                   letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
  .switch button:hover { color: var(--ink); }
  .switch button.on { background: var(--switch-on); color: var(--ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 1.1rem; }
  .legend .item { display: flex; align-items: center; gap: .45rem; font-size: .8rem; color: var(--ink-2); }
  .legend .item img { width: 18px; height: 18px; }
  .legend .key { width: 16px; height: 2px; border-radius: 1px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick-text { fill: var(--tick); font-size: 11px; font-variant-numeric: tabular-nums; }
  .axis-title { fill: var(--tick); font-size: 11px; }
  .series-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .crosshair { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
  /* A 2px surface ring keeps a highlighted point legible where lines overlap. */
  .focus-dot { stroke: var(--surface); stroke-width: 2; pointer-events: none; }

  .tooltip { position: absolute; pointer-events: none; background: var(--hover-bg); border: 1px solid var(--border);
             border-radius: 8px; padding: .6rem .75rem; font-size: .78rem; min-width: 190px;
             box-shadow: 0 6px 20px rgba(0,0,0,.45); z-index: 5; display: none; }
  .tooltip .when { color: var(--ink-muted); font-size: .72rem; }
  .tooltip .headline { display: flex; align-items: center; gap: .45rem; margin: .35rem 0 .5rem;
                       padding-bottom: .5rem; border-bottom: 1px solid var(--hairline); }
  .tooltip .headline img { width: 20px; height: 20px; flex: none; }
  .tooltip .headline .what { color: var(--ink); font-weight: 600; word-break: break-word; }
  .tooltip .row { display: flex; align-items: center; gap: .45rem; line-height: 1.7; }
  .tooltip .row .key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
  /* Values lead, series names follow: here the reader already has the series. */
  .tooltip .row .val { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 2.6em;
                       text-align: right; }
  .tooltip .row .nm { color: var(--ink-2); }

  /* ---------- table view (the tooltip must never be the only way to a value) ---------- */
  table { border-collapse: collapse; width: 100%; font-size: .82rem; margin-top: 1rem; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--hairline); }
  th { color: var(--ink-2); font-weight: 600; font-size: .72rem; letter-spacing: .05em;
       text-transform: uppercase; }
  td.num { font-variant-numeric: tabular-nums; }
  .empty { color: var(--ink-muted); font-size: .85rem; }
  /* Shown only when the tracker has never heard from the reporter and has nothing to
     show. Amber rather than red: nothing is broken, something is simply not installed. */
  .notice { margin: 0 0 1.5rem; padding: .9rem 1.1rem; border-radius: 8px;
            border: 1px solid #4a3d1e; background: #23200f; color: var(--ink-2);
            font-size: .85rem; line-height: 1.5; }
  .notice b { color: var(--ink); }
  .notice code { background: rgba(255,255,255,.06); padding: .1rem .3rem; border-radius: 3px; }
  footer { margin-top: 2.5rem; font-size: .78rem; color: var(--ink-muted); }
</style>
</head>

// Slot order is the CVD-safety mechanism, so it is fixed and never cycled.
const SERIES = [
  { kind: "Quest",           name: "Quests",            colour: "var(--series-quest)" },
  { kind: "Diagram",         name: "Diagrams",          colour: "var(--series-diagram)" },
  { kind: "Formula",         name: "Formulae",          colour: "var(--series-formula)" },
  { kind: "PointOfInterest", name: "Points of Interest",colour: "var(--series-poi)" },
  { kind: "GwentCard",       name: "Gwent Cards",       colour: "var(--series-gwent)" },
];
const KIND_LABELS = Object.fromEntries(SERIES.map(s => [s.kind, s.name]));
const MODE_HINTS = {
  base100: "White Orchard, Velen, Novigrad, Skellige, Kaer Morhen - no DLC content",
  hos100:  "Hearts of Stone only - a standalone start, no main game",
  baw100:  "Blood and Wine only - a standalone start, no main game",
  all300:  "Base game + Hearts of Stone + Blood and Wine, combined",
};

let modesCatalog = [];
let timeline = { runStartedAt: null, unlocks: [] };

/* When a completion happened, in seconds of play.
 *
 * Not wall-clock time since the run started: a run spans days, and the hours nobody was
 * playing are not part of it. The tracker accumulates only the time the game was actually
 * writing to its log, and stamps every completion with that total, so a run resumed
 * tomorrow continues the chart where today left it rather than restarting at zero or
 * jumping fourteen hours to the right.
 *
 * Completions recorded before the tracker measured play time have none, and fall back to
 * wall clock, which is what they were plotted against when they were recorded.
 */
function playSeconds(u, t0) {
  if (u.playElapsedSeconds != null) return u.playElapsedSeconds;
  return t0 ? (new Date(u.timestamp).getTime() - t0) / 1000 : 0;
}

let loadedUnlockCount = -1;
let showTable = false;
let lastState = null;
/** "category" draws one line per kind; "total" collapses them into the run's pace. */
let chartView = "category";
/** "real" plots against wall-clock elapsed time; "igt" against the optional in-game clock. */
let timeAxis = "real";

/* ------------------------------------------------------------------ helpers */

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  // Display names come from the game's own localisation, so they are treated as
  // untrusted text and never concatenated into markup.
  if (text != null) node.textContent = text;
  return node;
}

function elapsed(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h > 0 ? h + "h " + String(m).padStart(2, "0") + "m"
               : m + "m " + String(s % 60).padStart(2, "0") + "s";
}

/** h:mm:ss, for a running clock - padded so the figure keeps its width as it ticks. */
function clock(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  return Math.floor(s / 3600)
    + ":" + String(Math.floor((s % 3600) / 60)).padStart(2, "0")
    + ":" + String(s % 60).padStart(2, "0");
}

/* The icon shown against one completion: the game's own pin artwork once that pin type
   has been identified, then the per-kind stand-in, then the category icon. PIN_ICONS and
   ROW_ICON_OVERRIDES both live in /icons.js, shared with the overlay. */
function iconFor(u) {
  if (u.kind === "PointOfInterest") return PIN_ICONS[u.region] || PIN_ICON_FALLBACK;
  return ROW_ICON_OVERRIDES[u.kind] || ICONS[u.kind] || "";
}

/** What a completion is called on screen.
 *
 *  Everything the game names is shown by its real, localised name - the same string the
 *  on-screen pickup message uses. Points of interest are the exception, and not by
 *  choice: the game has no name for the ones a completion run has to clear. Of 470
 *  countable pins exactly one carries a localisation string; the couple of hundred that
 *  do are signposts and notice boards, none of which count. So the pin type is not a
 *  shortcut here, it is the only thing there is to show. */
function unlockLabel(u) {
  if (u.kind !== "PointOfInterest") return u.displayName;
  return looksInternal(u.displayName, u.catalogId) ? (u.regionLabel || 'Point of Interest') : u.displayName;
}

/** Whether a name is just the identifier tidied up rather than something the game said. */
function looksInternal(name, id) {
  if (!name || !id) return true;
  return name.replace(/\s+/g, "_").toLowerCase()
       === id.replace(/\s+/g, "_").toLowerCase();
}

/* ------------------------------------------------------------------- chart */

/* The aggregate view's own identity.
 *
 * Deliberately not one of the five category colours: the two views share a toggle, and a
 * line that was "Quests" a moment ago must not come back meaning "everything". Validated
 * against this surface both alone and alongside the five. */
const TOTAL_SERIES = { kind: "_total", name: "Total", colour: "#9085e9" };

function buildChart(container, view, modeProgress, axis) {
  // The in-game-time axis can only place completions recorded while the clock was
  // running - it cannot be reconstructed after the fact - so a completion from before
  // tracking started simply has no in-game-time coordinate and is left out of this view,
  // rather than plotted at a wrong or zero position.
  const usingIgt = axis === "igt";
  const unlocks = usingIgt ? timeline.unlocks.filter(u => u.igtElapsedSeconds != null) : timeline.unlocks;
  if (unlocks.length < 2) {
    container.appendChild(el("div", "empty", usingIgt
      ? "The in-game-time axis appears once the clock has been running for a couple of completions."
      : "The chart appears once the run has recorded a couple of completions."));
    return;
  }

  // In the aggregate view the categories are not drawn at all, so one line stands for
  // every completion in order - the run's pace, with nothing to read across.
  const drawn = view === "total" ? [TOTAL_SERIES] : SERIES;

  const t0 = new Date(timeline.runStartedAt || unlocks[0].timestamp).getTime();
  const points = unlocks
    .map(u => ({ u, t: usingIgt ? u.igtElapsedSeconds : playSeconds(u, t0) }))
    .sort((a, b) => a.t - b.t);

  // Cumulative count, one step per completion. Which counter a completion advances is
  // the only difference between the two views.
  const running = {};
  drawn.forEach(s => running[s.kind] = 0);
  const series = {};
  drawn.forEach(s => series[s.kind] = [{ t: 0, y: 0 }]);

  for (const p of points) {
    const key = view === "total" ? TOTAL_SERIES.kind : p.u.kind;
    if (running[key] === undefined) continue;
    running[key] += 1;
    series[key].push({ t: p.t, y: running[key] });
    p.totals = Object.assign({}, running);
  }

  const tMax = Math.max(points[points.length - 1].t, 1);
  const yMax = Math.max(1, ...drawn.map(s => running[s.kind]));

  const W = 1040, H = 380, PAD = { t: 16, r: 132, b: 40, l: 52 };
  const plotW = W - PAD.l - PAD.r, plotH = H - PAD.t - PAD.b;
  const X = t => PAD.l + (t / tMax) * plotW;
  const Y = v => PAD.t + plotH - (v / yMax) * plotH;

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("role", "img");
  const axisNoun = usingIgt ? "elapsed in-game time" : "time played";
  svg.setAttribute("aria-label", view === "total"
    ? "Cumulative completions over " + axisNoun + ", all categories combined."
    : "Cumulative completions over " + axisNoun + ", one line per category.");

  const add = (name, attrs, parent) => {
    const n = document.createElementNS(NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(n);
    return n;
  };

  // Recessive grid and axis, drawn first so data sits above them.
  const yTicks = niceTicks(yMax, 5);
  for (const v of yTicks) {
    add("line", { class: "grid-line", x1: PAD.l, x2: PAD.l + plotW, y1: Y(v), y2: Y(v) });
    const label = add("text", { class: "tick-text", x: PAD.l - 8, y: Y(v) + 4, "text-anchor": "end" });
    label.textContent = v;
  }
  add("line", { class: "axis-line", x1: PAD.l, x2: PAD.l + plotW,
                y1: PAD.t + plotH, y2: PAD.t + plotH });

  for (const t of niceTicks(tMax, 6)) {
    const label = add("text", { class: "tick-text", x: X(t), y: PAD.t + plotH + 18,
                                "text-anchor": "middle" });
    label.textContent = elapsed(t);
  }
  const xTitle = add("text", { class: "axis-title", x: PAD.l + plotW / 2,
                               y: PAD.t + plotH + 34, "text-anchor": "middle" });
  xTitle.textContent = axisNoun;

  // Step lines: a completion is a discrete jump, so the line holds its value and steps.
  const endLabels = [];
  for (const s of drawn) {
    const pts = series[s.kind];
    if (pts.length < 2) continue;
    let d = "M " + X(pts[0].t) + " " + Y(pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      d += " L " + X(pts[i].t) + " " + Y(pts[i - 1].y) + " L " + X(pts[i].t) + " " + Y(pts[i].y);
    }
    d += " L " + X(tMax) + " " + Y(pts[pts.length - 1].y);
    add("path", { class: "series-line", d, stroke: s.colour });
    endLabels.push({ s, y: Y(pts[pts.length - 1].y) });
  }

  // Direct labels at the end of each line: identity without reaching for the legend.
  // Two categories that finish on nearly the same count would print on top of each
  // other, so they are pushed apart to a minimum spacing first - a collided label is
  // worse than one sitting a few pixels off its line.
  endLabels.sort((a, b) => a.y - b.y);
  const MIN_GAP = 17;
  for (let i = 1; i < endLabels.length; i++) {
    if (endLabels[i].y - endLabels[i - 1].y < MIN_GAP) {
      endLabels[i].y = endLabels[i - 1].y + MIN_GAP;
    }
  }
  for (const { s, y } of endLabels) {
    // The aggregate series has no artwork of its own - it is every category at once - so
    // its label carries text only rather than a broken image.
    const icon = ICONS[s.kind];
    if (icon) {
      const img = add("image", { x: X(tMax) + 8, y: y - 9, width: 18, height: 18, href: icon });
      img.setAttribute("preserveAspectRatio", "xMidYMid meet");
    }
    const lbl = add("text", { class: "tick-text", x: X(tMax) + (icon ? 30 : 8), y: y + 4 });
    lbl.setAttribute("fill", "var(--tick)");
    lbl.textContent = s.name + " " + running[s.kind];
  }

  const crosshair = add("line", { class: "crosshair", y1: PAD.t, y2: PAD.t + plotH,
                                  x1: 0, x2: 0, opacity: 0 });
  const focusLayer = add("g", {});
  const hit = add("rect", { x: PAD.l, y: PAD.t, width: plotW, height: plotH,
                            fill: "transparent", tabindex: "0" });

  container.appendChild(svg);
  const tip = el("div", "tooltip");
  container.appendChild(tip);

  // Nearest-point in X: the reader aims at a moment, not at a 2px line.
  function focusAt(clientX) {
    const box = svg.getBoundingClientRect();
    const t = ((clientX - box.left) / box.width * W - PAD.l) / plotW * tMax;

    let best = points[0], bestGap = Infinity;
    for (const p of points) {
      const gap = Math.abs(p.t - t);
      if (gap < bestGap) { bestGap = gap; best = p; }
    }

    crosshair.setAttribute("x1", X(best.t));
    crosshair.setAttribute("x2", X(best.t));
    crosshair.setAttribute("opacity", 1);

    focusLayer.textContent = "";
    for (const s of drawn) {
      const v = best.totals ? best.totals[s.kind] : 0;
      if (!v) continue;
      const dot = document.createElementNS(NS, "circle");
      dot.setAttribute("class", "focus-dot");
      dot.setAttribute("cx", X(best.t));
      dot.setAttribute("cy", Y(v));
      dot.setAttribute("r", s.kind === best.u.kind ? 5.5 : 3.5);
      dot.setAttribute("fill", s.colour);
      focusLayer.appendChild(dot);
    }

    tip.textContent = "";
    tip.appendChild(el("div", "when", "at " + elapsed(best.t)));

    const head = el("div", "headline");
    const icon = el("img");
    icon.src = iconFor(best.u);
    icon.alt = "";
    head.appendChild(icon);
    head.appendChild(el("span", "what", unlockLabel(best.u)));
    tip.appendChild(head);

    // Every series is listed at this X, so the pointer never has to find a line. In the
    // aggregate view that is a single row, and it carries the denominator too, since
    // "412" on its own says much less than "412 of 1,565".
    for (const s of drawn) {
      const v = best.totals ? best.totals[s.kind] : 0;
      const row = el("div", "row");
      const key = el("span", "key");
      key.style.background = s.colour;
      row.appendChild(key);
      row.appendChild(el("span", "val", String(v)));
      row.appendChild(el("span", "nm",
        s.kind === TOTAL_SERIES.kind && modeProgress ? "of " + modeProgress.total : s.name));
      tip.appendChild(row);
    }

    const px = X(best.t) / W * box.width;
    tip.style.display = "block";
    tip.style.left = Math.min(Math.max(px - tip.offsetWidth / 2, 4),
                              container.clientWidth - tip.offsetWidth - 4) + "px";
    // Below the legend row, so the readout never sits on top of the key it explains.
    tip.style.top = "52px";
  }

  hit.addEventListener("pointermove", e => focusAt(e.clientX));
  hit.addEventListener("pointerleave", () => {
    tip.style.display = "none";
    crosshair.setAttribute("opacity", 0);
    focusLayer.textContent = "";
  });
  // Keyboard reaches the same detail as the pointer.
  let cursor = points.length - 1;
  hit.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    cursor = Math.min(points.length - 1, Math.max(0, cursor + (e.key === "ArrowRight" ? 1 : -1)));
    const box = svg.getBoundingClientRect();
    focusAt(box.left + X(points[cursor].t) / W * box.width);
  });
}

/** Round tick values so the axis reads in human steps. */
function niceTicks(max, count) {
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const ticks = [];
  for (let v = 0; v <= max + 1e-9; v += step) ticks.push(Math.round(v * 100) / 100);
  return ticks;
}

/* ------------------------------------------------------------------- views */

function renderPicker() {
  const app = document.getElementById("app");
  app.textContent = "";
  // No run is selected yet, so there is nothing for the toolbar's actions to act on -
  // it lives in the header band now (see .topbar), so it has to be cleared explicitly
  // rather than simply not being drawn this time.
  document.getElementById("toolbar").textContent = "";
  const picker = el("div", "picker");
  for (const mode of modesCatalog) {
    const btn = el("button");
    btn.appendChild(el("div", "label", mode.name));
    btn.appendChild(el("div", "scope", MODE_HINTS[mode.id] || mode.scope.join(" + ")));
    btn.onclick = () => fetch("/api/mode", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: mode.id })
    });
    picker.appendChild(btn);
  }
  app.appendChild(picker);
}

function renderDashboard(state, mode) {
  const app = document.getElementById("app");
  app.textContent = "";

  // The toolbar lives in the header band (see .topbar) rather than as its own row
  // above the content, so it is rebuilt in place each render instead of being appended
  // to #app.
  const bar = document.getElementById("toolbar");
  bar.textContent = "";
  const change = el("button", "btn", "Change mode");
  change.onclick = renderPicker;
  const overlay = el("a", "btn", "Open overlay");
  overlay.href = "/overlay"; overlay.target = "_blank";
  const map = el("a", "btn", "Map");
  map.href = "/map";
  const table = el("button", "btn", showTable ? "Hide table" : "Show table");
  table.onclick = () => { showTable = !showTable; renderDashboard(state, mode); };
  const reset = el("button", "btn danger", "Reset run");
  reset.onclick = async () => {
    if (!confirm("Reset the run back to zero? Do this before loading the savegame a fresh run starts from.")) return;
    await fetch("/api/reset", { method: "POST" });
  };
  // Optional in-game-time clock: real time with loading screens subtracted, read straight
  // out of the game's own process memory the way the community's speedrun autosplitter
  // does. Windows only, and only while the game is running - meant to be pressed before
  // loading the savegame a run starts from, the same moment an autosplitter itself would
  // be started.
  const igt = el("button", "btn igt", igtLabel({
    active: state.igtActive,
    elapsedSeconds: state.igtElapsedSeconds || 0,
    loading: state.igtLoading,
  }));
  igt.title = state.igtDetail ||
    "Reads the game's own loading-screen flag out of its memory - the same signal the community's speedrun autosplitter uses. Windows only, and only while Witcher 3 is running.";
  igt.onclick = async () => {
    if (state.igtActive) {
      await fetch("/api/igt/stop", { method: "POST" });
      // Read back rather than assume: the button has to show the paused total, and the
      // press must be visibly answered even if the pushed state is a moment behind.
      await readIgt();
      return;
    }
    const res = await fetch("/api/igt/start", { method: "POST" });
    const body = await res.json();
    if (!body.started) {
      alert("Could not start the in-game-time clock: " + (body.detail || "unknown reason") +
        "\n\nMake sure Witcher 3 is running first, then try again.");
    }
    await readIgt();
  };
  // One tidy right-aligned group - see .toolbar. "Fix Gwent" lives on the Gwent Cards
  // tile below instead, next to the number it actually affects.
  bar.append(change, table, map, igt, overlay, reset);

  const hero = el("div", "hero");
  hero.appendChild(el("span", "pct", mode.percent + "%"));
  hero.appendChild(el("span", "frac", mode.completed + " / " + mode.total));
  app.appendChild(hero);

  const track = el("div", "bar");
  const fill = el("i");
  fill.style.width = Math.min(100, mode.percent) + "%";
  track.appendChild(fill);
  app.appendChild(track);

  const kinds = el("div", "kinds");
  for (const s of SERIES) {
    const row = mode.byKind.find(k => k.kind === s.kind);
    if (!row) continue;
    const card = el("div", "kind");
    card.style.setProperty("--kind-colour", s.colour);
    const img = el("img"); img.src = ICONS[s.kind]; img.alt = "";
    const text = el("div");
    text.appendChild(el("div", "name", s.name));
    text.appendChild(el("div", "figure", row.completed + " / " + row.total));
    card.append(img, text);
    if (s.kind === "GwentCard") {
      const fixGwent = el("button", "fix", "Manually fix gwent cards");
      fixGwent.title = "Marks the Geralt and Ciri hero cards as owned. Use this if you have them in your collection but the tracker still shows them missing - a known base-game quirk, not a WitcherTrack bug.";
      fixGwent.onclick = async (e) => {
        e.stopPropagation();
        if (!confirm("Mark the Geralt and Ciri Gwent cards as owned?\n\nOnly do this if you actually have them - the base game sometimes fails to report these two even when you do.")) return;
        await fetch("/api/fix-gwent", { method: "POST" });
      };
      card.appendChild(fixGwent);
    }
    kinds.appendChild(card);
  }
  app.appendChild(kinds);

  app.appendChild(el("h2", "section", "Progress over time"));
  app.appendChild(el("p", "section-note",
    "Cumulative completions against time played, accumulated across every session this run has lived through. Hover the chart to read what was picked up at that moment."));

  const card = el("div", "chart-card");

  // The view switch sits above the chart it scopes, on its own row.
  const head = el("div", "chart-head");
  const switcher = el("div", "switch");
  for (const [id, label] of [["category", "By category"], ["total", "Total"]]) {
    const b = el("button", chartView === id ? "on" : null, label);
    b.setAttribute("aria-pressed", String(chartView === id));
    b.onclick = () => { chartView = id; renderDashboard(state, mode); };
    switcher.appendChild(b);
  }
  head.appendChild(switcher);

  // The in-game-time axis is only worth offering once there is something to plot on it -
  // otherwise it is a switch to an empty chart, which reads as broken rather than unused.
  const hasIgtData = timeline.unlocks.some(u => u.igtElapsedSeconds != null);
  if (hasIgtData) {
    const axisSwitcher = el("div", "switch");
    for (const [id, label] of [["real", "Real time"], ["igt", "In-game time"]]) {
      const b = el("button", timeAxis === id ? "on" : null, label);
      b.setAttribute("aria-pressed", String(timeAxis === id));
      b.onclick = () => { timeAxis = id; renderDashboard(state, mode); };
      axisSwitcher.appendChild(b);
    }
    head.appendChild(axisSwitcher);
  } else {
    timeAxis = "real";
  }

  // A single series needs no legend: the switch above already names it.
  if (chartView === "category") {
    const legend = el("div", "legend");
    for (const s of SERIES) {
      const item = el("div", "item");
      const img = el("img"); img.src = ICONS[s.kind]; img.alt = "";
      const key = el("span", "key"); key.style.background = s.colour;
      item.append(img, key, el("span", null, s.name));
      legend.appendChild(item);
    }
    head.appendChild(legend);
  }

  card.appendChild(head);
  buildChart(card, chartView, mode, timeAxis);
  app.appendChild(card);

  if (showTable) {
    const tableBlock = buildTable();
    // The table is its own section, not a caption under the chart - without this it
    // butts straight up against the chart card's bottom edge.
    tableBlock.style.marginTop = "2.5rem";
    app.appendChild(tableBlock);
  }
}

/** The table is what keeps every value reachable without hovering. */
function buildTable() {
  const wrap = el("div");
  wrap.appendChild(el("h2", "section", "Completions in order"));
  const t = el("table");
  const head = el("tr");
  ["At", "Category", "What", "Content pack"].forEach(h => head.appendChild(el("th", null, h)));
  t.appendChild(head);

  const t0 = timeline.runStartedAt ? new Date(timeline.runStartedAt).getTime() : null;
  const rows = timeline.unlocks.slice().reverse().slice(0, 250);
  for (const u of rows) {
    const tr = el("tr");
    const at = elapsed(playSeconds(u, t0));
    tr.appendChild(el("td", "num", at));
    tr.appendChild(el("td", null, KIND_LABELS[u.kind] || u.kind));
    tr.appendChild(el("td", null, unlockLabel(u)));
    tr.appendChild(el("td", null, u.dlc));
    t.appendChild(tr);
  }
  wrap.appendChild(t);
  if (timeline.unlocks.length > 250) {
    wrap.appendChild(el("p", "section-note",
      "Showing the 250 most recent of " + timeline.unlocks.length + "."));
  }
  return wrap;
}

/* -------------------------------------------------------------------- wire */

/* The one failure the tracker cannot distinguish from a quiet moment.
 *
 * With no mod installed, the script log holds no WT lines and the dashboard sits at zero
 * forever - which looks exactly like a run that has not started yet. Nothing here is
 * broken, so this is a notice rather than an error, and it is deliberately narrow: it
 * appears only when the reporter has never been heard from *and* the run is empty. A
 * resumed run whose game is simply not open right now is not this.
 */
async function reporterNotice(state) {
  const box = document.getElementById("reporter-notice");

  if (state.unlockCount > 0 || state.knownStates > 0) { box.textContent = ""; return; }

  let health;
  try { health = await (await fetch("/api/health")).json(); } catch { return; }

  const reporter = (health.sources || []).find(s => /reporter/i.test(s.name));
  if (!reporter || reporter.connected) { box.textContent = ""; return; }

  if (box.firstChild) return;   // already up; do not rebuild it on every push

  const note = el("div", "notice");
  note.innerHTML =
    "<b>Nothing has been heard from the in-game reporter yet.</b> "
    + "That is normal until the game has been started once with the mod installed. If it "
    + "stays this way, check that <code>Documents\\The Witcher 3\\scriptslog.txt</code> "
    + "contains lines beginning <code>WT|</code>. None at all means the mod is missing, is "
    + "in the wrong folder, was overwritten by another script mod, or the game was launched "
    + "without <code>-debugscripts</code>. See INSTALL.md.";
  box.appendChild(note);
}

/* The other failure that looks like nothing being wrong.
 *
 * run.json lives beside the executable, so updating the tracker by extracting it into a
 * different folder leaves the run behind. The next report re-asserts every completion, the
 * totals come back right, and only the timings are lost - re-dated to the moment the
 * tracker was reopened. There is nothing to see unless someone says so.
 *
 * Narrow on purpose. It needs a session that began with no stored run and that nobody
 * reset, plus completed quests and points of interest, which a genuinely new playthrough
 * does not have. A standalone Hearts of Stone or Blood and Wine start is exactly the case
 * that would trip a threshold counting diagrams: it hands over a pre-made Geralt who
 * already knows dozens of them, and no quest history at all.
 */
function freshRunNotice(state, mode) {
  const box = document.getElementById("fresh-notice");
  const counted = kind => (mode.byKind.find(k => k.kind === kind) || {}).completed || 0;

  if (!state.startedFresh || counted("Quest") + counted("PointOfInterest") < 10) {
    box.textContent = "";
    return;
  }

  if (box.firstChild) return;   // already up; do not rebuild it on every push

  const note = el("div", "notice");
  note.innerHTML =
    "<b>This run has no stored history.</b> The tracker started without a "
    + "<code>run.json</code> beside it and the game has already reported a run in progress, "
    + "which is what updating into a different folder looks like. The counts are right; the "
    + "times are not, because a report says <i>that</i> something is done and never when. "
    + "To get them back: close the tracker, copy <code>run.json</code> from the folder you "
    + "were running before into this one, and start it again. If this really is a new run, "
    + "press <i>Reset run</i> and the notice goes away.";
  box.appendChild(note);
}

async function render(state) {
  lastState = state;
  reporterNotice(state);
  document.getElementById("status").textContent =
    state.catalogSize + " catalogue entries · updated " +
    new Date(state.generatedAt).toLocaleTimeString();

  if (state.catalogSize === 0) {
    document.getElementById("toolbar").textContent = "";
    const app = document.getElementById("app");
    app.textContent = "";
    app.appendChild(el("div", "empty",
      "Totals are zero because catalog.json was not found next to the executable. " +
      "Build one from a reference dump:  WitcherTrack catalog scriptslog.txt"));
    return;
  }

  if (!modesCatalog.length) modesCatalog = await (await fetch("/api/modes")).json();

  if (!state.activeModeId) {
    document.getElementById("mode-tag").textContent = "";
    renderPicker();
    return;
  }

  // Only refetch the history when it has actually grown.
  if (state.unlockCount !== loadedUnlockCount) {
    timeline = await (await fetch("/api/timeline")).json();
    loadedUnlockCount = state.unlockCount;
  }

  const mode = state.modes.find(m => m.rulesetId === state.activeModeId);
  const info = modesCatalog.find(m => m.id === state.activeModeId);
  document.getElementById("mode-tag").textContent = info ? info.name : "";
  // Before the picker returns, not after: a fresh start has no mode chosen yet, and the
  // picker is the first thing an update lands you on. With no selection the fullest mode
  // stands in, since the notice only ever reads counts off it.
  freshRunNotice(state, mode || state.modes.reduce((a, b) => b.completed > a.completed ? b : a));
  if (!mode) { renderPicker(); return; }
  renderDashboard(state, mode);
}

/* A new state is only pushed when the run changes, which is far too rarely for a clock:
   it would sit frozen between pickups. This used to fill the gap by counting up locally
   from the last reading, which is wrong in the one place it matters - a loading screen
   pushes nothing, so the display counted straight through exactly the time the server was
   busy excluding, and a paused clock went on ticking forever because nothing ever arrived
   to say it had stopped. So the display asks instead of guessing: /api/igt is one small
   reading, once a second, and only while the clock is attached. */
let igtRunning = false;

function igtLabel(igt) {
  const time = clock(igt.elapsedSeconds || 0);
  if (igt.active) {
    // The loading marker is not decoration: it is the only way to see from outside the
    // game that the flag being read is the right one for this build.
    return "Stop in-game timer · " + time + (igt.loading ? " · loading" : "");
  }
  return igt.elapsedSeconds > 0 ? "Resume in-game timer · " + time : "Start in-game timer";
}

function paintIgt(igt) {
  const button = document.querySelector(".btn.igt");
  if (button) { button.textContent = igtLabel(igt); }
}

async function readIgt() {
  try {
    const igt = await (await fetch("/api/igt")).json();
    igtRunning = igt.active;
    paintIgt(igt);
  } catch {
    // The server is gone; the stream's own error handler is what says so.
  }
}

const stream = new EventSource("/api/events");
stream.onmessage = e => {
  const state = JSON.parse(e.data);
  igtRunning = state.igtActive;
  render(state);
};
stream.onerror = () => {
  document.getElementById("status").textContent = "disconnected - is WitcherTrack still running?";
};

setInterval(() => { if (igtRunning) { readIgt(); } }, 1000);
</script>
</body>
</html>
