<!DOCTYPE html>
<!--
  OBS overlay.

  Geometry is taken from the reference mockup by measurement, not by eye: 64px icons,
  70px between stat blocks, 24px from an icon to its text, a 22px label over a 21px
  value on a 26px baseline step, and a five-line feed on a 22px line step under the
  banner. Changing the look means changing the numbers in :root below.

  Add as a Browser Source pointing at http://127.0.0.1:PORT/overlay. The background is
  transparent by design so it composites straight over gameplay.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>WitcherTrack overlay</title>
<style>
  :root {
    /* Industrial/metallic, matching the dashboard rather than the original mockup's
       gold. The two are seen together on a stream - the dashboard on one scene, this
       composited over gameplay on another - so they carry the same ink.
       --accent and --ink are the dashboard's own values; the translucent fills are
       stated as rgba of --accent's channels, because this page composites over
       gameplay and cannot use the dashboard's opaque surfaces. */
    --accent: #b9c6d1;            /* label and value ink */
    --ink:    #e6e9ec;            /* the feed's brighter text */
    --muted:  #9aa3ad;
    --banner: rgba(185,198,209,.42);
    --track:  rgba(185,198,209,.22);
    --icon: 64px;
    --block-gap: 70px;            /* between one block's text and the next block's icon */
    --icon-text-gap: 24px;
    --inset-x: 139px;             /* the mockup's own left offset */
    --inset-y: 150px;
  }

  html, body { margin: 0; padding: 0; background: transparent; }
  * { box-sizing: border-box; }
  body {
    font: 400 21px/1.2 "Segoe UI", system-ui, -apple-system, sans-serif;
    padding: var(--inset-y) 0 0 var(--inset-x);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- stat row ---------- */
  /* The run's overall bar is the last item on this same row, after Gwent Cards, so it
     reads as the total the four counters beside it add up to - rather than as a
     separate band underneath competing with the banner below. */
  /* Wraps so that a browser source narrower than the five blocks need drops the overall
     bar onto its own line rather than clipping it off the right edge - at 1920 it all
     sits on one row, which is what this is laid out for. */
  .stats { display: flex; align-items: center; gap: 18px var(--block-gap); flex-wrap: wrap; }
  /* The four category blocks are rewritten as a group on every push, so they get their
     own container - otherwise rewriting them would take the overall block with them. */
  .cats { display: flex; align-items: center; gap: var(--block-gap); }
  .stat { display: flex; align-items: center; gap: var(--icon-text-gap); }
  .stat > img { width: var(--icon); height: var(--icon); display: block; flex: none; }
  .stat .text { color: var(--accent); white-space: nowrap; }
  .stat .label { font-size: 22px; line-height: 26px; }
  .stat .value { font-size: 21px; line-height: 26px; }
  .stat .value b { font-weight: 400; }   /* the mockup does not bold the figure */

  /* ---------- overall progress ---------- */
  /* The dashboard's headline bar at overlay scale, sitting inline as the last block of
     the stat row. It carries no icon, so its two text lines are set on the same 26px
     baseline step the stat blocks use and the track hangs below them - the block ends
     up the same height as a 64px icon, and the row stays level. */
  .overall { width: 230px; flex: none; color: var(--accent); white-space: nowrap; }
  .overall .row { display: flex; align-items: baseline; gap: 10px; }
  .overall .pct { font-size: 22px; line-height: 26px; }
  .overall .frac { font-size: 21px; line-height: 26px; }
  .overall .track {
    height: 4px; border-radius: 2px; overflow: hidden; margin-top: 6px;
    background: var(--track);
  }
  .overall .track > i { display: block; height: 100%; background: var(--accent);
                        border-radius: 2px; }

  /* ---------- last obtained ---------- */
  /* Square on the left, rounded on the right - measured 5px, and only on that side. */
  /* Pure white rather than --ink: the banner's fill is a light tint of that same ink,
     so the label sat almost on top of its own background. This is the one place on the
     page that needs to out-contrast a light surface instead of gameplay. */
  .banner {
    width: 291px; height: 30px; margin-top: 66px;
    background: var(--banner); border-radius: 0 5px 5px 0;
    color: #fff; font-size: 20px; line-height: 30px; padding-left: 11px;
  }

  /* The reference mockup listed these as bare text. An icon per row was added on top of
     it deliberately: at a glance it says which counter just moved, which the name alone
     does not. Row pitch stays at the mockup's 22px, so the block keeps its proportions -
     the icon is sized to the row rather than the row grown to fit the icon. */
  .feed { margin-top: 10px; padding-left: 11px; }
  .feed .row {
    display: flex; align-items: center; gap: 8px; height: 22px;
    opacity: 0; animation: enter .3s ease forwards;
  }
  .feed .row img { width: 20px; height: 20px; flex: none; }
  .feed .row span {
    color: var(--ink); font-size: 20px; line-height: 22px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  @keyframes enter { from { opacity: 0; transform: translateX(-6px); }
                      to { opacity: 1; transform: translateX(0); } }
</style>
</head>
<body>
  <div class="stats">
    <div class="cats" id="stats"></div>
    <div class="overall" id="overall"></div>
  </div>
  <div class="banner">Last Obtained</div>
  <div class="feed" id="feed"></div>

// Per-kind icons for the feed rows, and per-pin-type icons on top of them.
const KIND_ICONS = {
  Quest: CATEGORIES[0].icon, PointOfInterest: CATEGORIES[1].icon,
  Diagram: CATEGORIES[2].icon, Formula: CATEGORIES[2].icon, GwentCard: CATEGORIES[3].icon,
};

/* The game's own pin artwork once that pin type has been identified, then the per-kind
   stand-in, then the category icon. Both tables live in /icons.js. */
function iconFor(u) {
  if (u.kind === 'PointOfInterest') return PIN_ICONS[u.region] || PIN_ICON_FALLBACK;
  return ROW_ICON_OVERRIDES[u.kind] || KIND_ICONS[u.kind] || '';
}

function looksInternal(name, id) {
  if (!name || !id) return true;
  return name.replace(/\s+/g, '_').toLowerCase() === id.replace(/\s+/g, '_').toLowerCase();
}

/** The game's own localised name - the same string its pickup message shows.
 *  Points of interest fall back to the pin type because the game has no name for the
 *  ones a run must clear: of 470 countable pins exactly one carries a localised string. */
function unlockLabel(u) {
  if (u.kind !== 'PointOfInterest') return u.displayName;
  return looksInternal(u.displayName, u.catalogId) ? (u.regionLabel || 'Point of Interest') : u.displayName;
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text == null ? '' : text;
  return d.innerHTML;
}

function render(state) {
  const mode = (state.modes || []).find(m => m.rulesetId === state.activeModeId);
  const stats = document.getElementById('stats');
  const feed = document.getElementById('feed');

  const overall = document.getElementById('overall');

  if (!mode) {
    stats.innerHTML = '<div class="stat"><div class="text"><div class="label">'
      + 'Pick a run mode on the dashboard.</div></div></div>';
    overall.innerHTML = '';
    feed.innerHTML = '';
    return;
  }

  // Only the categories this mode counts. A mode reports one byKind row per kind it has
  // anything to count, so its own answer decides: Hearts of Stone and Blood and Wine ask
  // for no Gwent cards, a Gwent run asks for nothing but them, and a row reading 0 / 0 in
  // either case is a line of the overlay spent saying nothing.
  const shown = CATEGORIES
    .map(cat => {
      let done = 0, total = 0, counted = false;
      for (const kind of cat.kinds) {
        const row = mode.byKind.find(k => k.kind === kind);
        if (row) { done += row.completed; total += row.total; counted = true; }
      }
      return { cat, done, total, counted };
    })
    .filter(entry => entry.counted);

  stats.innerHTML = shown.map(({ cat, done, total }) =>
    '<div class="stat"><img src="' + cat.icon + '" alt="">'
    + '<div class="text"><div class="label">' + cat.label + '</div>'
    + '<div class="value"><b>' + done + '</b> / ' + total + '</div></div></div>'
  ).join('');

  // The run's headline, mirroring the dashboard's own bar at overlay scale, laid out on
  // the stat blocks' own two-line rhythm: the percentage where their label sits, the
  // fraction where their value does.
  //
  // No clock here on purpose. The tracker can measure in-game time - the dashboard
  // offers it, and the chart can be plotted against it - but a runner already has
  // LiveSplit on screen, and a second timer beside it is one more thing to disagree
  // with the first.
  overall.innerHTML =
    '<div class="row"><span class="pct">' + mode.percent + '%</span></div>'
    + '<div class="frac">' + mode.completed + ' / ' + mode.total + '</div>'
    + '<div class="track"><i style="width:' + Math.min(100, mode.percent) + '%"></i></div>';

  feed.innerHTML = (state.recentUnlocks || []).slice(0, 5).map(u =>
    '<div class="row"><img src="' + iconFor(u) + '" alt="">'
    + '<span>' + escapeHtml(unlockLabel(u)) + '</span></div>'
  ).join('');
}

const stream = new EventSource('/api/events');
stream.onmessage = e => render(JSON.parse(e.data));
</script>
